<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Data Management</h1>

        <div class="form-container">
            <h2>Add / Edit Student</h2>
            <form id="studentForm">
                <input type="hidden" id="editIndex">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="studentId">Student ID:</label>
                    <input type="text" id="studentId" required>
                </div>
                <div class="form-group">
                    <label for="class">Class:</label>
                    <input type="text" id="class" required>
                </div>
                <div class="form-group">
                    <label for="grade">Grade:</label>
                    <input type="number" id="grade" min="0" max="100" required>
                </div>
                <button type="submit" id="submitBtn">Add Student</button>
                <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
            </form>
        </div>

        <div class="table-container">
            <h2>Student List</h2>
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Student ID</th>
                        <th>Class</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Student rows will be added here dynamically -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
